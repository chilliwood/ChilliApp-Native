name: Build iOS TestFlight

# Compila, firma y sube a TestFlight desde un runner macOS de GitHub. En un
# repositorio público los minutos de los runners estándar —macOS incluido— son
# gratis e ilimitados en cualquier plan, así que esto no cuesta nada.
#
# A diferencia del de Android, este NO corre en cada push: subir un build a
# TestFlight consume un número de compilación y gatilla el procesamiento de
# Apple. Se lanza a mano desde la pestaña "Actions".
on:
  workflow_dispatch:

env:
  APP_VERSION: '1.0'          # visible en App Store; sube a 1.1, 2.0, etc.
  BUNDLE_ID: cl.chilliwood.chilliapp

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (npm)
        run: npm install

      - name: Generar el proyecto iOS
        # La carpeta ios/ no vive en el repo: se genera en cada ejecucion.
        # Eso mantiene el repo limpio, pero obliga a volver a aplicar por
        # script todo lo que normalmente se configuraria a mano en Xcode
        # (permisos, version, esquema) — es lo que hacen los pasos siguientes.
        #
        # Capacitor 8 integra los plugins con Swift Package Manager, no con
        # CocoaPods: escribe un Package.swift y NO genera Podfile ni
        # App.xcworkspace. Por eso xcodebuild tiene que apuntar al .xcodeproj.
        # Se detecta cual de los dos existe en vez de asumirlo, asi el
        # workflow sigue sirviendo si algun dia vuelven a los pods.
        run: |
          set -e
          if [ ! -d ios ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi
          echo "── Contenido de ios/App ──"
          ls -la ios/App
          if [ -d ios/App/App.xcworkspace ]; then
            echo "XCODE_CONTAINER=-workspace ios/App/App.xcworkspace" >> "$GITHUB_ENV"
            echo "Usando workspace (CocoaPods)"
          elif [ -d ios/App/App.xcodeproj ]; then
            echo "XCODE_CONTAINER=-project ios/App/App.xcodeproj" >> "$GITHUB_ENV"
            echo "Usando proyecto (Swift Package Manager)"
          else
            echo "No se genero ni App.xcworkspace ni App.xcodeproj."
            exit 1
          fi

      - name: Regenerar iconos de iOS desde assets/icon.png
        # ESTE PASO TIENE QUE IR DESPUES de generar el proyecto. Antes corria
        # primero y por eso la app salia con el icono generico de Capacitor:
        # @capacitor/assets escribe en ios/App/App/Assets.xcassets, que todavia
        # no existia. En Android nunca se noto porque la carpeta android/ si
        # vive en el repo. No se silencia el error: si falla, se ve por que.
        run: |
          echo "── Contenido de assets/ ──"
          ls -la assets || echo "(no hay carpeta assets)"
          npx @capacitor/assets generate --ios || echo "AVISO: la generacion de iconos fallo — revisar el mensaje de arriba"
          echo "── Iconos resultantes ──"
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset || echo "(no se genero el appiconset)"

      - name: Declarar permisos y encriptación en Info.plist
        # Sin estos textos la app NO pide el permiso: se cae en el momento en
        # que intenta abrir la cámara. Apple además los lee en la revisión —
        # un permiso sin explicación es motivo de rechazo.
        # ITSAppUsesNonExemptEncryption=false declara que la app solo usa
        # HTTPS, que es la excepción estándar; sin esta clave App Store
        # Connect pregunta por la documentación de exportación en cada envío.
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'ChilliApp usa la cámara para grabar tus videos con el teleprompter en pantalla.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'ChilliApp usa el micrófono para grabar el audio de tus videos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'ChilliApp guarda en tu galería los videos que grabas.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'ChilliApp accede a tu galería para que puedas usar tus imágenes en la app.'" "$PLIST"
          # ITMS-90683: el analisis estatico del binario detecto que una de las
          # bibliotecas incluidas (el plugin de media, que guarda videos en la
          # galeria y lee los metadatos que la camara incrusta) referencia la
          # API de localizacion. Apple exige el texto explicativo aunque el
          # codigo propio nunca pida el permiso, porque el analisis no
          # distingue entre lo que usa la app y lo que trae una dependencia.
          # En la practica este permiso no se solicita nunca en pantalla.
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'ChilliApp solo accede a la ubicacion para conservar los datos de lugar que tu camara guarda junto a los videos. No se usa para ninguna otra cosa ni se comparte.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          echo "── Info.plist resultante ──"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      - name: Asegurar el esquema compartido de Xcode
        # Xcode escribe el esquema la primera vez que alguien abre el proyecto
        # en la interfaz gráfica. En un runner sin pantalla eso no pasa nunca,
        # así que xcodebuild -scheme App se queda sin nada que resolver. Se
        # crea acá solo si falta; si la plantilla de Capacitor ya lo trae, no
        # se toca nada.
        run: |
          DIR=ios/App/App.xcodeproj/xcshareddata/xcschemes
          if [ -f "$DIR/App.xcscheme" ]; then
            echo "El esquema ya existe, no se toca."
            exit 0
          fi
          mkdir -p "$DIR"
          BLOB=$(grep -m1 -E '[0-9A-F]{24} /\* App \*/ = \{' ios/App/App.xcodeproj/project.pbxproj | awk '{print $1}')
          echo "BlueprintIdentifier del target App: $BLOB"
          cat > "$DIR/App.xcscheme" <<XCSCHEME
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BLOB" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BLOB" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$BLOB" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"/>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration="Debug"/>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          XCSCHEME
          # El heredoc de arriba va indentado dentro del YAML; se limpia acá.
          sed -i '' -E 's/^ {10}//' "$DIR/App.xcscheme"
          echo "Esquemas disponibles:"
          xcodebuild $XCODE_CONTAINER -list

      - name: Preparar la clave de App Store Connect
        # altool busca el .p8 en rutas fijas y con un nombre exacto
        # (AuthKey_<KEYID>.p8); no acepta una ruta arbitraria.
        #
        # El contenido se NORMALIZA en vez de confiar en como quedo pegado en
        # el secreto: al copiar un .p8 desde un editor de Windows se cuelan
        # saltos CRLF, y al pegarlo desde ciertos visores queda todo en una
        # sola linea. En ambos casos xcodebuild falla con
        # "invalidPEMDocument", que no dice nada sobre la causa real.
        # Se reconstruye el PEM desde el base64: cabecera, cuerpo en lineas de
        # 64 caracteres, y cierre.
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -e
          mkdir -p ~/private_keys
          DEST=~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          printf '%s' "$APPSTORE_PRIVATE_KEY" > /tmp/key.raw
          python3 - "$DEST" <<'PY'
          import re, sys, base64
          crudo = open('/tmp/key.raw', 'rb').read().decode('utf-8', 'replace')
          crudo = crudo.replace('\r', '')
          cuerpo = re.sub(r'-----[A-Z ]+-----', '', crudo)
          cuerpo = re.sub(r'\s+', '', cuerpo)
          if not cuerpo:
              sys.exit('El secreto APPSTORE_PRIVATE_KEY llego vacio.')
          try:
              base64.b64decode(cuerpo, validate=True)
          except Exception as e:
              sys.exit('El contenido de APPSTORE_PRIVATE_KEY no es base64 valido: %s' % e)
          lineas = [cuerpo[i:i+64] for i in range(0, len(cuerpo), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lineas) + '\n-----END PRIVATE KEY-----\n'
          open(sys.argv[1], 'w').write(pem)
          print('PEM reconstruido: %d caracteres de base64, %d lineas de cuerpo' % (len(cuerpo), len(lineas)))
          PY
          rm -f /tmp/key.raw
          chmod 600 "$DEST"
          # Comprobacion real: que openssl la reconozca como clave privada.
          # Falla aca, con mensaje claro, en vez de 10 minutos despues.
          openssl pkey -in "$DEST" -noout \
            && echo "La clave privada es valida." \
            || { echo "openssl no reconoce la clave — revisa que el secreto APPSTORE_PRIVATE_KEY tenga el contenido completo del .p8."; exit 1; }

      - name: Archivar la app (sin firmar)
        # Se archiva SIN firma a proposito. Con firma automatica, xcodebuild
        # firma el archivo para DESARROLLO — asi funciona Xcode: archiva con
        # firma de desarrollo y re-firma para distribucion al exportar. El
        # problema es que un perfil de desarrollo solo lo emite Apple si el
        # equipo tiene algun dispositivo registrado, y aca no hay ninguno ni
        # hace falta: el destino es TestFlight, no un iPhone de pruebas.
        #
        # Desactivando la firma en esta etapa no se pide ningun perfil, y la
        # firma real —la de distribucion App Store— la aplica el paso de
        # exportacion, que si sabe crear el certificado y el perfil con la
        # clave de API. Es el camino habitual en CI sin Mac.
        #
        # Tampoco se pasa PRODUCT_BUNDLE_IDENTIFIER: en la linea de comandos
        # aplicaria a los 14 targets, incluidos los paquetes de terceros. El
        # identificador correcto ya viene de capacitor.config.json.
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild $XCODE_CONTAINER \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          echo "Archivo generado sin firmar — la firma de distribucion la pone el paso de exportacion."


      - name: Exportar el .ipa
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          sed -i '' -E 's/^ {10}//' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Dejar el .ipa descargable
        uses: actions/upload-artifact@v4
        with:
          name: chilliapp-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Subir a TestFlight
        # Apple marcó --upload-app como obsoleto en favor de --upload-package,
        # pero el juego de parámetros cambió entre versiones de Xcode. Se
        # intenta primero el nuevo y se cae al anterior si el runner trae un
        # Xcode que todavía no lo acepta.
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "Subiendo: $IPA"
          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apple-id "${{ env.BUNDLE_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "${{ github.run_number }}" \
            --bundle-short-version-string "${{ env.APP_VERSION }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
          || xcrun altool --upload-app -f "$IPA" \
            --type ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "Listo. Apple tarda entre 5 y 15 minutos en procesar el build antes de que aparezca en TestFlight."
