name: Build Android APK

# Corre automático en cada push a main, y también se puede lanzar a mano
# desde la pestaña "Actions" de GitHub (botón "Run workflow") sin necesitar
# hacer un push — útil para generar un build de prueba sin cambiar nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Java (lo exige el build de Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Android SDK
        # packages: '' es obligatorio. Por defecto esta accion instala
        # "tools platform-tools", y Google retiro el paquete legado "tools"
        # de su repositorio el 14-09-2026: sdkmanager no lo encuentra, aborta,
        # y el build muere antes de compilar nada. Con la lista vacia no
        # instala nada y se usa el SDK que el runner ya trae preinstalado,
        # que incluye platform-tools y build-tools — todo lo que Gradle necesita.
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar dependencias (npm)
        run: npm install

      - name: Regenerar íconos de Android desde assets/icon.png
        # @capacitor/assets genera automáticamente las 5 resoluciones que
        # pide Android (mdpi a xxxhdpi) a partir de una sola imagen fuente.
        # Si assets/icon.png no existe todavía, este paso no rompe el build
        # — solo deja los íconos genéricos de siempre hasta que se agregue.
        run: npx @capacitor/assets generate --android || echo "assets/icon.png no encontrado — se mantienen los íconos actuales"

      - name: Sincronizar Capacitor con el proyecto Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a gradlew
        # A veces se pierde el permiso de ejecución al subir el proyecto a
        # GitHub — este paso lo asegura siempre, sin costo si ya lo tenía.
        run: chmod +x android/gradlew

      - name: Compilar el APK de depuración
        # "assembleDebug" genera un APK que se puede instalar directo en el
        # celular sin necesidad de la firma paga de Google Play — perfecto
        # para las pruebas en el Samsung. Se mantiene igual que siempre,
        # para no interrumpir las pruebas con amigos.
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Dejar el APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: chilliapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Restaurar la llave de firma desde el secreto
        # El keystore vive codificado en base64 dentro del secreto
        # KEYSTORE_BASE64 (nunca en texto plano en el repo). Este paso lo
        # decodifica de vuelta a un archivo real, solo dentro de este run —
        # nunca se guarda ni se sube a ningún lado. "tr -d" limpia espacios
        # y saltos de línea que a veces se cuelan al copiar un string tan
        # largo a mano — sin esto, un solo carácter de más corrompe el
        # binario del keystore de forma silenciosa.
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore

      - name: Verificar que la llave quedó bien ANTES de compilar
        # Falla rápido y con un mensaje legible (keytool) en vez de esperar
        # 3 minutos de compilación para recién enterarnos, enterrado en un
        # error críptico de Gradle/bundletool, de que el keystore llegó
        # corrupto o la contraseña/alias no calzan.
        working-directory: android/app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: keytool -list -keystore release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS"

      - name: Compilar el AAB firmado para Play Store
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Dejar el AAB descargable
        uses: actions/upload-artifact@v4
        with:
          name: chilliapp-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
